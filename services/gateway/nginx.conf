load_module modules/ngx_http_modsecurity_module.so;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 128; }

http {
    client_body_temp_path /var/cache/nginx/client_temp 1 2;
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp 1 2;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp 1 2;
    scgi_temp_path /var/cache/nginx/scgi_temp 1 2;
    proxy_max_temp_file_size 0;
    log_format argus_json escape=json '{"schema_version":"argus.waf-tap/v1","timestamp":"$time_iso8601","request_id":"$http_x_argus_request_id","run_id":"$http_x_argus_run_id","method":"$request_method","uri":"$uri","status":$status,"request_length":$request_length,"response_length":$body_bytes_sent,"crs_engine":"detection_only"}';
    access_log /evidence/waf-request-tap.jsonl argus_json;

    server {
        listen 8080;
        client_max_body_size 32k;
        client_body_buffer_size 32k;
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        location / {
            modsecurity on;
            modsecurity_rules_file /etc/nginx/modsecurity/main.conf;
            proxy_pass http://web:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-ARGUS-Run-Id $http_x_argus_run_id;
            proxy_set_header X-ARGUS-Request-Id $http_x_argus_request_id;
        }
    }
}
